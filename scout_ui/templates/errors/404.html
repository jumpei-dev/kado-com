{% extends "base.html" %}

{% block title %}ページが見つかりません - Scout UI{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8 text-center">
        <div>
            <div class="mx-auto h-12 w-12 flex items-center justify-center rounded-full bg-yellow-100">
                <i class="fas fa-search text-yellow-600 text-xl"></i>
            </div>
            <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">
                404 - ページが見つかりません
            </h2>
            <p class="mt-2 text-center text-sm text-gray-600">
                お探しのページは存在しないか、移動された可能性があります。
            </p>
        </div>
        
        <div class="mt-8">
            <a href="/" class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md text-white bg-primary-600 hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500">
                <i class="fas fa-home mr-2"></i>
                ホームに戻る
            </a>
        </div>
    </div>
</div>
{% endblock %}
