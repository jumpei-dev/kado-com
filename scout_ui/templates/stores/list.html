{% extends "base.html" %}

{% block title %}店舗一覧 - Scout UI{% endblock %}

{% block content %}
<!-- Header Section -->
<div class="mb-8">
    <div class="md:flex md:items-center md:justify-between">
        <div class="flex-1 min-w-0">
            <h2 class="text-2xl font-bold leading-7 text-gray-900 sm:text-3xl sm:truncate">
                <i class="fas fa-store mr-3 text-primary-500"></i>
                店舗一覧
            </h2>
            <p class="mt-1 text-sm text-gray-500">
                全店舗の詳細情報と稼働状況
            </p>
        </div>
        <div class="mt-4 flex md:mt-0 md:ml-4">
            <button onclick="exportCSV()" class="inline-flex items-center px-4 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500">
                <i class="fas fa-download mr-2"></i>
                CSV出力
            </button>
            <button onclick="exportRanking()" class="ml-3 inline-flex items-center px-4 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500">
                <i class="fas fa-trophy mr-2"></i>
                ランキング出力
            </button>
            <button onclick="openFilterModal()" class="ml-3 inline-flex items-center px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-primary-600 hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500">
                <i class="fas fa-filter mr-2"></i>
                フィルター
            </button>
        </div>
    </div>
</div>

<!-- Controls Section -->
<div class="bg-white shadow rounded-lg mb-6">
    <div class="px-6 py-4 border-b border-gray-200">
        <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
            <div class="flex flex-wrap items-center gap-4">
                <div class="flex items-center space-x-2">
                    <label class="text-sm font-medium text-gray-700">表示形式:</label>
                    <select id="view-type" class="border border-gray-300 rounded-md px-3 py-1 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500">
                        <option value="grid" {% if current_filters.view_type == 'grid' %}selected{% endif %}>グリッド</option>
                        <option value="table" {% if current_filters.view_type == 'table' %}selected{% endif %}>テーブル</option>
                    </select>
                </div>
                
                <div class="flex items-center space-x-2">
                    <label class="text-sm font-medium text-gray-700">ソート:</label>
                    <select id="sort-by" class="border border-gray-300 rounded-md px-3 py-1 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500">
                        <option value="working_rate" {% if current_filters.sort_by == 'working_rate' %}selected{% endif %}>稼働率</option>
                        <option value="name" {% if current_filters.sort_by == 'name' %}selected{% endif %}>店舗名</option>
                        <option value="area" {% if current_filters.sort_by == 'area' %}selected{% endif %}>エリア</option>
                        <option value="cast_count" {% if current_filters.sort_by == 'cast_count' %}selected{% endif %}>キャスト数</option>
                        <option value="avg_rating" {% if current_filters.sort_by == 'avg_rating' %}selected{% endif %}>評価</option>
                    </select>
                    <select id="sort-order" class="border border-gray-300 rounded-md px-3 py-1 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500">
                        <option value="desc" {% if current_filters.sort_order == 'desc' %}selected{% endif %}>降順</option>
                        <option value="asc" {% if current_filters.sort_order == 'asc' %}selected{% endif %}>昇順</option>
                    </select>
                </div>
                
                <div class="flex items-center space-x-2">
                    <label class="text-sm font-medium text-gray-700">表示件数:</label>
                    <select id="page-size" class="border border-gray-300 rounded-md px-3 py-1 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500">
                        <option value="10" {% if current_filters.page_size == 10 %}selected{% endif %}>10件</option>
                        <option value="20" {% if current_filters.page_size == 20 %}selected{% endif %}>20件</option>
                        <option value="50" {% if current_filters.page_size == 50 %}selected{% endif %}>50件</option>
                        <option value="100" {% if current_filters.page_size == 100 %}selected{% endif %}>100件</option>
                    </select>
                </div>
            </div>
            
            <div class="flex items-center justify-end space-x-2 mt-2 lg:mt-0">
                <span class="text-sm text-gray-500" id="result-count">読み込み中...</span>
                <button onclick="refreshData()" class="inline-flex items-center px-4 py-2 border border-gray-300 rounded-md text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-primary-500">
                    <i class="fas fa-sync-alt mr-2"></i>
                    表示更新
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Store List -->
<div class="bg-white shadow rounded-lg">
    <div class="px-6 py-4 border-b border-gray-200">
        <h3 class="text-lg font-medium text-gray-900">
            <i class="fas fa-list mr-2 text-primary-500"></i>
            店舗データ
        </h3>
    </div>
    
    <div id="store-content" class="p-6">
        <div class="flex items-center justify-center py-12">
            <div class="loading mr-3"></div>
            <span class="text-gray-500">データを読み込み中...</span>
        </div>
    </div>
    
    <!-- Pagination -->
    <div id="pagination" class="px-6 py-4 border-t border-gray-200 hidden">
        <!-- Pagination will be inserted here -->
    </div>
</div>

<!-- Filter Modal -->
<div id="filter-modal" class="fixed inset-0 z-50 hidden">
    <div class="modal-backdrop fixed inset-0" onclick="closeFilterModal()"></div>
    <div class="fixed inset-0 flex items-center justify-center p-4">
        <div class="bg-white rounded-lg shadow-xl max-w-md w-full max-h-screen overflow-y-auto">
            <div class="px-6 py-4 border-b border-gray-200">
                <div class="flex items-center justify-between">
                    <h3 class="text-lg font-medium text-gray-900">
                        <i class="fas fa-filter mr-2 text-primary-500"></i>
                        フィルター設定
                    </h3>
                    <button onclick="closeFilterModal()" class="text-gray-400 hover:text-gray-600">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            </div>
            
            <div class="px-6 py-4 space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">エリア</label>
                    <select id="filter-area" class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary-500">
                        <option value="">すべてのエリア</option>
                        {% for area in filter_options.areas %}
                        <option value="{{ area }}" {% if current_filters.area == area %}selected{% endif %}>{{ area }}</option>
                        {% endfor %}
                    </select>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">業種</label>
                    <select id="filter-business-type" class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary-500">
                        <option value="">すべての業種</option>
                        {% for business_type in filter_options.business_types %}
                        <option value="{{ business_type }}" {% if current_filters.business_type == business_type %}selected{% endif %}>{{ business_type }}</option>
                        {% endfor %}
                    </select>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">稼働率</label>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs text-gray-500 mb-1">最小値(%)</label>
                            <input type="number" id="filter-min-rate" min="0" max="100" class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500" value="{{ current_filters.min_working_rate or '' }}">
                        </div>
                        <div>
                            <label class="block text-xs text-gray-500 mb-1">最大値(%)</label>
                            <input type="number" id="filter-max-rate" min="0" max="100" class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500" value="{{ current_filters.max_working_rate or '' }}">
                        </div>
                    </div>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">期間</label>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs text-gray-500 mb-1">開始日</label>
                            <input type="date" id="filter-date-from" class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500" value="{{ current_filters.date_from }}">
                        </div>
                        <div>
                            <label class="block text-xs text-gray-500 mb-1">終了日</label>
                            <input type="date" id="filter-date-to" class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500" value="{{ current_filters.date_to }}">
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="px-6 py-4 border-t border-gray-200 flex justify-end space-x-3">
                <button onclick="clearFilters()" class="px-4 py-2 border border-gray-300 rounded-md text-sm font-medium text-gray-700 bg-white hover:bg-gray-50">
                    クリア
                </button>
                <button onclick="applyFilters()" class="px-4 py-2 border border-transparent rounded-md text-sm font-medium text-white bg-primary-600 hover:bg-primary-700">
                    適用
                </button>
            </div>
        </div>
    </div>
</div>

{% endblock %}

{% block extra_js %}
<script>
    let currentPage = 1;
    let currentFilters = {
        area: '',
        business_type: '',
        date_from: '',
        date_to: '',
        min_working_rate: '',
        max_working_rate: '',
        sort_by: 'working_rate',
        sort_order: 'desc',
        view_type: 'grid',
        page_size: 20
    };
    
    // Initialize page
    document.addEventListener('DOMContentLoaded', function() {
        loadStores();
        
        // Event listeners for controls
        document.getElementById('view-type').addEventListener('change', function() {
            currentFilters.view_type = this.value;
            currentPage = 1;
            loadStores();
        });
        
        document.getElementById('sort-by').addEventListener('change', function() {
            currentFilters.sort_by = this.value;
            currentPage = 1;
            loadStores();
        });
        
        document.getElementById('sort-order').addEventListener('change', function() {
            currentFilters.sort_order = this.value;
            currentPage = 1;
            loadStores();
        });
        
        document.getElementById('page-size').addEventListener('change', function() {
            currentFilters.page_size = parseInt(this.value);
            currentPage = 1;
            loadStores();
        });
        
        // Filter controls
        document.getElementById('filter-area').addEventListener('change', function() {
            currentFilters.area = this.value;
            currentPage = 1;
            loadStores();
        });
        
        document.getElementById('filter-business-type').addEventListener('change', function() {
            currentFilters.business_type = this.value;
            currentPage = 1;
            loadStores();
        });
        
        document.getElementById('filter-min-rate').addEventListener('input', function() {
            currentFilters.min_working_rate = this.value;
            currentPage = 1;
            loadStores();
        });
        
        document.getElementById('filter-max-rate').addEventListener('input', function() {
            currentFilters.max_working_rate = this.value;
            currentPage = 1;
            loadStores();
        });
        
        document.getElementById('filter-date-from').addEventListener('change', function() {
            currentFilters.date_from = this.value;
            currentPage = 1;
            loadStores();
        });
        
        document.getElementById('filter-date-to').addEventListener('change', function() {
            currentFilters.date_to = this.value;
            currentPage = 1;
            loadStores();
        });
        
        // Clear filters button
        document.getElementById('clear-filters').addEventListener('click', function() {
            // Reset all filters
            currentFilters = {
                area: '',
                business_type: '',
                date_from: '',
                date_to: '',
                min_working_rate: '',
                max_working_rate: '',
                sort_by: 'working_rate',
                sort_order: 'desc',
                view_type: 'grid',
                page_size: 20
            };
            currentPage = 1;
            
            // Reset form elements
            document.getElementById('filter-area').value = '';
            document.getElementById('filter-business-type').value = '';
            document.getElementById('filter-min-rate').value = '';
            document.getElementById('filter-max-rate').value = '';
            document.getElementById('filter-date-from').value = '';
            document.getElementById('filter-date-to').value = '';
            document.getElementById('sort-by').value = 'working_rate';
            document.getElementById('sort-order').value = 'desc';
            document.getElementById('view-type').value = 'grid';
            document.getElementById('page-size').value = '20';
            
            loadStores();
        });
    });
    
    // Load stores function
    async function loadStores() {
        try {
            showLoading();
            
            const params = new URLSearchParams({
                page: currentPage,
                page_size: currentFilters.page_size,
                area: currentFilters.area || '',
                business_type: currentFilters.business_type || '',
                date_from: currentFilters.date_from || '',
                date_to: currentFilters.date_to || '',
                sort_by: currentFilters.sort_by,
                sort_order: currentFilters.sort_order,
                view_type: currentFilters.view_type
            });
            
            if (currentFilters.min_working_rate) {
                params.append('min_working_rate', currentFilters.min_working_rate);
            }
            if (currentFilters.max_working_rate) {
                params.append('max_working_rate', currentFilters.max_working_rate);
            }
            
            const response = await fetch(`/api/stores/list?${params}`);
            const data = await response.json();
            
            if (response.ok) {
                if (currentFilters.view_type === 'grid') {
                    renderStoreGrid(data.stores);
                } else {
                    renderStoreTable(data.stores);
                }
                
                if (data.pagination) {
                    renderPagination(data.pagination);
                    updateStoreCount(data.pagination.total_count);
                }
            } else {
                showError('店舗データの読み込みに失敗しました: ' + (data.message || 'Unknown error'));
            }
        } catch (error) {
            console.error('Error loading stores:', error);
            showError('店舗データの読み込み中にエラーが発生しました');
        } finally {
            hideLoading();
        }
    }
    
    // Render store grid
    function renderStoreGrid(stores) {
        const container = document.getElementById('stores-container');
        
        if (!Array.isArray(stores)) {
            container.innerHTML = '<div class="col-span-full text-center py-8 text-gray-500">店舗データの読み込みに失敗しました</div>';
            return;
        }
        
        if (stores.length === 0) {
            container.innerHTML = '<div class="col-span-full text-center py-8 text-gray-500">条件に一致する店舗が見つかりませんでした</div>';
            return;
        }
        
        const gridHtml = stores.map(store => `
            <div class="bg-white rounded-lg shadow-md p-6 hover:shadow-lg transition-shadow">
                <div class="flex justify-between items-start mb-4">
                    <h3 class="text-lg font-semibold text-gray-900">${escapeHtml(store.name)}</h3>
                    <span class="px-2 py-1 text-xs rounded-full ${
                        store.status === 'active' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'
                    }">
                        ${store.status === 'active' ? '営業中' : '休業中'}
                    </span>
                </div>
                
                <div class="space-y-2 text-sm text-gray-600">
                    <div class="flex justify-between">
                        <span>エリア:</span>
                        <span>${escapeHtml(store.area)}</span>
                    </div>
                    <div class="flex justify-between">
                        <span>業種:</span>
                        <span>${escapeHtml(store.business_type)}</span>
                    </div>
                    <div class="flex justify-between">
                        <span>稼働率:</span>
                        <span class="font-semibold ${
                            store.working_rate === null || store.working_rate === undefined 
                                ? 'text-gray-500' 
                                : store.working_rate >= 0.7 ? 'text-green-600' 
                                : store.working_rate >= 0.4 ? 'text-yellow-600' 
                                : 'text-red-600'
                        }">
                            ${
                                store.working_rate === null || store.working_rate === undefined 
                                    ? '-' 
                                    : (store.working_rate * 100).toFixed(1) + '%'
                            }
                        </span>
                    </div>
                    <div class="flex justify-between">
                        <span>キャスト数:</span>
                        <span>${store.active_cast_count}/${store.cast_count}人</span>
                    </div>
                    <div class="flex justify-between">
                        <span>最終更新:</span>
                        <span>${formatDate(store.last_updated)}</span>
                    </div>
                </div>
                
                <div class="mt-4 pt-4 border-t border-gray-200">
                    <a href="/stores/${store.id}" class="text-primary-600 hover:text-primary-800 text-sm font-medium">
                        詳細を見る →
                    </a>
                </div>
            </div>
        `).join('');
        
        container.innerHTML = gridHtml;
    }
    
    // Render store table
    function renderStoreTable(stores) {
        const container = document.getElementById('stores-container');
        
        if (!Array.isArray(stores)) {
            container.innerHTML = '<div class="text-center py-8 text-gray-500">店舗データの読み込みに失敗しました</div>';
            return;
        }
        
        if (stores.length === 0) {
            container.innerHTML = '<div class="text-center py-8 text-gray-500">条件に一致する店舗が見つかりませんでした</div>';
            return;
        }
        
        const tableHtml = `
            <div class="overflow-x-auto">
                <table class="min-w-full bg-white border border-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">店舗名</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">エリア</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">業種</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">稼働率</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">キャスト数</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">最終更新</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">操作</th>
                        </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200">
                        ${stores.map(store => `
                            <tr class="hover:bg-gray-50">
                                <td class="px-6 py-4 whitespace-nowrap">
                                    <div class="flex items-center">
                                        <div>
                                            <div class="text-sm font-medium text-gray-900">${escapeHtml(store.name)}</div>
                                            <div class="text-sm text-gray-500">
                                                <span class="px-2 py-1 text-xs rounded-full ${
                                                    store.status === 'active' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'
                                                }">
                                                    ${store.status === 'active' ? '営業中' : '休業中'}
                                                </span>
                                            </div>
                                        </div>
                                    </div>
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${escapeHtml(store.area)}</td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${escapeHtml(store.business_type)}</td>
                                <td class="px-6 py-4 whitespace-nowrap">
                                    <span class="text-sm font-semibold ${
                                        store.working_rate === null || store.working_rate === undefined 
                                            ? 'text-gray-500' 
                                            : store.working_rate >= 0.7 ? 'text-green-600' 
                                            : store.working_rate >= 0.4 ? 'text-yellow-600' 
                                            : 'text-red-600'
                                    }">
                                        ${
                                            store.working_rate === null || store.working_rate === undefined 
                                                ? '-' 
                                                : (store.working_rate * 100).toFixed(1) + '%'
                                        }
                                    </span>
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">
                                    ${store.active_cast_count}/${store.cast_count}人
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                                    ${formatDate(store.last_updated)}
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                                    <a href="/stores/${store.id}" class="text-primary-600 hover:text-primary-900">詳細</a>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            </div>
        `;
        
        container.innerHTML = tableHtml;
    }
    
    // Render pagination
    function renderPagination(pagination) {
        const container = document.getElementById('pagination-container');
        if (!container) return;
        
        const { page, total_pages, has_prev, has_next } = pagination;
        
        let paginationHtml = '<div class="flex items-center justify-between">';
        
        // Previous button
        paginationHtml += `
            <button 
                onclick="${has_prev ? 'goToPage(' + (page - 1) + ')' : ''}" 
                class="px-4 py-2 text-sm font-medium text-gray-500 bg-white border border-gray-300 rounded-md hover:bg-gray-50 ${!has_prev ? 'opacity-50 cursor-not-allowed' : ''}"
                ${!has_prev ? 'disabled' : ''}
            >
                前へ
            </button>
        `;
        
        // Page info
        paginationHtml += `
            <span class="text-sm text-gray-700">
                ${pagination.start_idx} - ${pagination.end_idx} / ${pagination.total_count}件
            </span>
        `;
        
        // Next button
        paginationHtml += `
            <button 
                onclick="${has_next ? 'goToPage(' + (page + 1) + ')' : ''}" 
                class="px-4 py-2 text-sm font-medium text-gray-500 bg-white border border-gray-300 rounded-md hover:bg-gray-50 ${!has_next ? 'opacity-50 cursor-not-allowed' : ''}"
                ${!has_next ? 'disabled' : ''}
            >
                次へ
            </button>
        `;
        
        paginationHtml += '</div>';
        
        container.innerHTML = paginationHtml;
    }
    
    // Go to page
    function goToPage(page) {
        currentPage = page;
        loadStores();
    }
    
    // Refresh data
    function refreshData() {
        currentPage = 1;
        loadStores();
    }
    
    // Update store count
    function updateStoreCount(count) {
        const countElement = document.getElementById('store-count');
        if (countElement) {
            countElement.textContent = count;
        }
    }
    
    // Utility functions
    function showLoading() {
        const container = document.getElementById('stores-container');
        container.innerHTML = '<div class="col-span-full text-center py-8"><div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-primary-600"></div></div>';
    }
    
    function hideLoading() {
        // Loading is hidden when content is rendered
    }
    
    function showError(message) {
        const container = document.getElementById('stores-container');
        container.innerHTML = `<div class="col-span-full text-center py-8 text-red-500">${escapeHtml(message)}</div>`;
    }
    
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
    
    function formatDate(dateString) {
        if (!dateString) return '-';
        const date = new Date(dateString);
        return date.toLocaleDateString('ja-JP', {
