{% extends "base.html" %}

{% block title %}ダッシュボード - Scout UI{% endblock %}

{% block content %}

<!-- Header Section -->
<div class="mb-8">
    <h2 class="text-2xl font-bold leading-7 text-gray-900 sm:text-3xl sm:truncate">
        <i class="fas fa-store mr-3 text-primary-500"></i>
        稼働率一覧
    </h2>
</div>

<!-- Unified Controls Section -->
<div class="mb-6">
    <!-- Desktop Controls (hidden on mobile) -->
    <div class="hidden md:flex flex-wrap items-center justify-end gap-4">
        <!-- Right side: Refresh, Filter and Export buttons -->
        <div class="flex items-center space-x-3">
                <button onclick="refreshData()" class="inline-flex items-center px-4 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500">
                    <i class="fas fa-sync-alt mr-2"></i>
                    表示更新
                </button>
                
                <button onclick="openFilterModal()" class="inline-flex items-center px-4 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500">
                    <i class="fas fa-filter mr-2"></i>
                    フィルター
                </button>
                
                <button onclick="openUserGuide()" class="inline-flex items-center px-4 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500">
                    <i class="fas fa-question-circle mr-2"></i>
                    使い方ガイド
                </button>
                
                <!-- Export Dropdown -->
                <div class="relative inline-block text-left" style="position: relative;">
                    <div>
                        <button type="button" onclick="toggleExportDropdown()" class="inline-flex items-center px-4 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500" id="export-menu-button" aria-expanded="true" aria-haspopup="true">
                            <i class="fas fa-download mr-2"></i>
                            出力
                            <i class="fas fa-chevron-down ml-2 -mr-1 h-4 w-4"></i>
                        </button>
                    </div>
                    <div id="export-dropdown" class="hidden origin-top-right absolute right-0 mt-2 w-56 rounded-md shadow-lg bg-white ring-1 ring-black ring-opacity-5 focus:outline-none z-50 md:right-0 md:left-auto" style="left: auto; right: 0; min-width: 200px;" role="menu" aria-orientation="vertical" aria-labelledby="export-menu-button" tabindex="-1">
                        <div class="py-1" role="none">
                            <a href="#" onclick="exportCSV()" class="text-gray-700 block px-4 py-2 text-sm hover:bg-gray-100" role="menuitem" tabindex="-1">
                                <i class="fas fa-file-csv mr-2"></i>
                                CSV出力
                            </a>
                            <a href="#" onclick="exportSimpleRanking()" class="text-gray-700 block px-4 py-2 text-sm hover:bg-gray-100" role="menuitem" tabindex="-1">
                                <i class="fas fa-trophy mr-2"></i>
                                簡易ランキング出力
                            </a>
                        </div>
                    </div>
                </div>
        </div>
    </div>
    
    <!-- Mobile Hamburger Menu (visible only on mobile) -->
    <div class="md:hidden flex justify-end">
        <div class="relative">
            <button onclick="toggleMobileMenu()" class="inline-flex items-center px-4 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500" id="mobile-menu-button">
                <i class="fas fa-bars"></i>
            </button>
            
            <!-- Mobile Menu Dropdown -->
            <div id="mobile-menu" class="hidden origin-top-right absolute right-0 mt-2 w-48 rounded-md shadow-lg bg-white ring-1 ring-black ring-opacity-5 focus:outline-none z-50" role="menu">
                <div class="py-1" role="none">
                    <button onclick="refreshData(); toggleMobileMenu();" class="text-gray-700 block w-full text-left px-4 py-2 text-sm hover:bg-gray-100" role="menuitem">
                        <i class="fas fa-sync-alt mr-2"></i>
                        表示更新
                    </button>
                    <button onclick="openFilterModal(); toggleMobileMenu();" class="text-gray-700 block w-full text-left px-4 py-2 text-sm hover:bg-gray-100" role="menuitem">
                        <i class="fas fa-filter mr-2"></i>
                        フィルター
                    </button>
                    <button onclick="openUserGuide(); toggleMobileMenu();" class="text-gray-700 block w-full text-left px-4 py-2 text-sm hover:bg-gray-100" role="menuitem">
                        <i class="fas fa-question-circle mr-2"></i>
                        使い方ガイド
                    </button>
                    <div class="border-t border-gray-100"></div>
                    <button onclick="exportCSV(); toggleMobileMenu();" class="text-gray-700 block w-full text-left px-4 py-2 text-sm hover:bg-gray-100" role="menuitem">
                        <i class="fas fa-file-csv mr-2"></i>
                        CSV出力
                    </button>
                    <button onclick="exportSimpleRanking(); toggleMobileMenu();" class="text-gray-700 block w-full text-left px-4 py-2 text-sm hover:bg-gray-100" role="menuitem">
                        <i class="fas fa-trophy mr-2"></i>
                        簡易ランキング出力
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Store Grid -->
<div class="bg-white shadow rounded-lg">

    
    <div id="store-grid" class="p-2">
        <div id="loading-indicator" class="flex items-center justify-center py-12">
            <div class="loading mr-3"></div>
            <span class="text-gray-500">データを読み込み中...</span>
        </div>
        <div id="stores-table-container" class="hidden overflow-x-auto">
            <table class="min-w-full border-collapse border border-gray-300">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="border border-gray-300 px-2 py-1 text-left text-xs font-medium text-gray-500 uppercase tracking-wider sticky left-0 bg-gray-50 z-20" style="min-width: 120px; max-width: 200px; font-size: 10px;">店舗名</th>
                        <th class="border border-gray-300 px-2 py-1 text-left text-xs font-medium text-gray-500 uppercase tracking-wider" style="min-width: 80px; max-width: 120px; font-size: 10px;">エリア</th>
                        <th class="border border-gray-300 px-2 py-1 text-left text-xs font-medium text-gray-500 uppercase tracking-wider" style="min-width: 80px; max-width: 120px; font-size: 10px;">業種</th>
                        <th id="date-headers"></th>
                    </tr>
                </thead>
                <tbody id="stores-table-body">
                </tbody>
            </table>
        </div>
    </div>
    
    <!-- Pagination -->
    <div id="pagination" class="px-6 py-4 border-t border-gray-200 hidden">
        <!-- Pagination will be inserted here -->
    </div>
</div>



<!-- Filter Modal -->
<div id="filter-modal" class="fixed inset-0 z-50 hidden">
    <div class="modal-backdrop fixed inset-0" onclick="closeFilterModal()"></div>
    <div class="fixed inset-0 flex items-center justify-center p-4">
        <div class="bg-white rounded-lg shadow-xl max-w-md w-full max-h-screen overflow-y-auto">
            <div class="px-6 py-4 border-b border-gray-200">
                <div class="flex items-center justify-between">
                    <h3 class="text-lg font-medium text-gray-900">
                        <i class="fas fa-filter mr-2 text-primary-500"></i>
                        フィルター設定
                    </h3>
                    <button onclick="closeFilterModal()" class="text-gray-400 hover:text-gray-600">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            </div>
            
            <div class="px-6 py-4 space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">表示形式</label>
                    <select id="filter-view-type" class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary-500">
                        <option value="weekly" {% if current_filters.view_type == 'weekly' %}selected{% endif %}>週ごと</option>
                        <option value="daily" {% if current_filters.view_type == 'daily' %}selected{% endif %}>日ごと</option>
                    </select>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">エリア</label>
                    <select id="filter-area" class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary-500">
                        <option value="">すべてのエリア</option>
                        {% for area in filter_options.areas %}
                        <option value="{{ area }}" {% if current_filters.area == area %}selected{% endif %}>{{ area }}</option>
                        {% endfor %}
                    </select>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">業種</label>
                    <select id="filter-business-type" class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary-500">
                        <option value="">すべての業種</option>
                        {% for business_type in filter_options.business_types %}
                        <option value="{{ business_type }}" {% if current_filters.business_type == business_type %}selected{% endif %}>{{ business_type }}</option>
                        {% endfor %}
                    </select>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">期間</label>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs text-gray-500 mb-1">開始日</label>
                            <input type="date" id="filter-date-from" class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500" value="{{ current_filters.date_from }}">
                        </div>
                        <div>
                            <label class="block text-xs text-gray-500 mb-1">終了日</label>
                            <input type="date" id="filter-date-to" class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500" value="{{ current_filters.date_to }}">
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="px-6 py-4 border-t border-gray-200 flex justify-end space-x-3">
                <button onclick="clearFilters()" class="px-4 py-2 border border-gray-300 rounded-md text-sm font-medium text-gray-700 bg-white hover:bg-gray-50">
                    クリア
                </button>
                <button onclick="applyFilters()" class="px-4 py-2 border border-transparent rounded-md text-sm font-medium text-white bg-primary-600 hover:bg-primary-700">
                    適用
                </button>
            </div>
        </div>
    </div>
</div>

{% endblock %}

{% block extra_js %}
<script>
    // Initialize page variables
    let currentPage = 1;
    let currentFilters = {
        area: '',
        business_type: '',
        date_from: '',
        date_to: '',
        sort_by: 'working_rate',
        sort_order: 'desc',
        view_type: 'weekly'
    };
    
    // Helper function to escape HTML
    function escapeHtml(text) {
        if (text === null || text === undefined) return '';
        const map = {
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#039;'
        };
        return text.toString().replace(/[&<>"']/g, function(m) { return map[m]; });
    }
    
    // Update store count display
    function updateStoreCount(total) {
        const countElement = document.querySelector('.text-2xl.font-bold');
        if (countElement) {
            countElement.innerHTML = `
                <i class="fas fa-store mr-3 text-primary-500"></i>
                稼働率一覧 (${total}件)
            `;
        }
    }
    
    // Load filter options from API
    async function loadFilterOptions() {
        try {
            const response = await fetch('/api/dashboard/filter-options');
            const data = await response.json();
            
            if (data.success) {
                const filterOptions = data.filter_options;
                
                // Update area filter
                const areaSelect = document.getElementById('filter-area');
                if (areaSelect) {
                    // Clear existing options except "すべてのエリア"
                    areaSelect.innerHTML = '<option value="">すべてのエリア</option>';
                    
                    // Add dynamic options
                    filterOptions.areas.forEach(area => {
                        const option = document.createElement('option');
                        option.value = area.value || area;
                        option.textContent = area.label || area;
                        areaSelect.appendChild(option);
                    });
                }
                
                // Update business type filter
                const businessTypeSelect = document.getElementById('filter-business-type');
                if (businessTypeSelect) {
                    // Clear existing options except "すべての業種"
                    businessTypeSelect.innerHTML = '<option value="">すべての業種</option>';
                    
                    // Add dynamic options
                    filterOptions.business_types.forEach(businessType => {
                        const option = document.createElement('option');
                        option.value = businessType.value || businessType;
                        option.textContent = businessType.label || businessType;
                        businessTypeSelect.appendChild(option);
                    });
                }
            }
        } catch (error) {
            console.error('Error loading filter options:', error);
        }
    }
    
    // Initialize page
    document.addEventListener('DOMContentLoaded', function() {
        loadFilterOptions();
        loadStores();
    });
    
    // Load stores data
    async function loadStores() {
        try {
            const params = new URLSearchParams({
                page: currentPage,
                limit: 20,
                ...currentFilters
            });
            
            // Remove empty values
            for (let [key, value] of params.entries()) {
                if (!value) {
                    params.delete(key);
                }
            }
            
            const response = await fetch(`/api/dashboard/stores?${params}`);
            const data = await response.json();
            
            if (data.success) {
                renderStoreGrid(data.stores);
                renderPagination(data.pagination);
                updateStoreCount(data.pagination.total);
            } else {
                throw new Error(data.message || '店舗データの取得に失敗しました');
            }
            
        } catch (error) {
            console.error('Error loading stores:', error);
            showToast('店舗データの読み込みに失敗しました', 'error');
        }
    }
    
    // Render store grid with date-based working rates
    function renderStoreGrid(stores) {
        const loadingIndicator = document.getElementById('loading-indicator');
        const tableContainer = document.getElementById('stores-table-container');
        const tableBody = document.getElementById('stores-table-body');
        
        // Hide loading indicator and show table
        loadingIndicator.classList.add('hidden');
        tableContainer.classList.remove('hidden');
        
        if (!stores || !Array.isArray(stores)) {
            tableBody.innerHTML = `
                <tr>
                    <td colspan="10" class="text-center py-12 text-red-500">
                        <i class="fas fa-exclamation-triangle text-4xl mb-4"></i>
                        <p>店舗データの読み込みに失敗しました</p>
                    </td>
                </tr>
            `;
            return;
        }
        
        if (stores.length === 0) {
            tableBody.innerHTML = `
                <tr>
                    <td colspan="10" class="text-center py-12 text-gray-500">
                        <i class="fas fa-search text-4xl mb-4"></i>
                        <p>条件に一致する店舗が見つかりませんでした</p>
                    </td>
                </tr>
            `;
            return;
        }
        
        // Generate date headers (last 7 days)
        const dates = [];
        for (let i = 6; i >= 0; i--) {
            const date = new Date();
            date.setDate(date.getDate() - i);
            dates.push(date);
        }
        
        // Update date headers
        const dateHeadersEl = document.getElementById('date-headers');
        if (dateHeadersEl) {
            dateHeadersEl.outerHTML = dates.map(date => {
                const monthDay = `${date.getMonth() + 1}/${date.getDate()}`;
                return `<th class="border border-gray-300 px-2 py-1 text-center text-xs font-medium text-gray-500 uppercase tracking-wider" style="font-size: 10px;">${monthDay}</th>`;
            }).join('');
        }
        
        // Render store rows
        tableBody.innerHTML = stores.map(store => {
            // Use actual daily rates from API or show "ー％" if no data
            const dateColumns = dates.map(date => {
                const dateStr = date.toISOString().split('T')[0];
                let displayValue;
                
                if (store.daily_rates && store.daily_rates[dateStr] !== null && store.daily_rates[dateStr] !== undefined) {
                    const rate = Math.round(store.daily_rates[dateStr] * 100);
                    displayValue = `${rate}%`;
                } else {
                    displayValue = 'ー％';
                }
                
                return `<td class="border border-gray-300 px-2 py-1 text-center text-xs" style="font-size: 11px;">${displayValue}</td>`;
            }).join('');
            
            return `
                <tr class="hover:bg-gray-50">
                    <td class="border border-gray-300 px-2 py-1 text-xs font-medium text-gray-900 sticky left-0 bg-white z-10">
                        <div style="min-width: 120px; max-width: 200px; word-wrap: break-word; line-height: 1.1; font-size: 11px;">
                            ${escapeHtml(store.name || 'かまくら御殿')}
                        </div>
                    </td>
                    <td class="border border-gray-300 px-2 py-1 text-xs text-gray-500">
                        <div style="min-width: 80px; max-width: 120px; word-wrap: break-word; line-height: 1.1; font-size: 11px;">
                            ${escapeHtml(store.area || '東京')}
                        </div>
                    </td>
                    <td class="border border-gray-300 px-2 py-1 text-xs text-gray-500" style="min-width: 80px; max-width: 120px; word-wrap: break-word; line-height: 1.1;">
                        <div style="min-width: 80px; max-width: 120px; word-wrap: break-word; line-height: 1.1; font-size: 11px;">
                            ${escapeHtml(store.business_type || 'ソープ')}
                        </div>
                    </td>
                    ${dateColumns}
                </tr>
            `;
        }).join('');
    }
    
    // Render pagination
    function renderPagination(pagination) {
        const paginationEl = document.getElementById('pagination');
        
        // Check if pagination data is valid
        if (!pagination || typeof pagination !== 'object') {
            console.error('Invalid pagination data:', pagination);
            paginationEl.classList.add('hidden');
            return;
        }
        
        if (pagination.total_pages <= 1) {
            paginationEl.classList.add('hidden');
            return;
        }
        
        paginationEl.classList.remove('hidden');
        
        const paginationHTML = `
            <div class="flex items-center justify-between">
                <div class="flex-1 flex justify-between sm:hidden">
                    <button onclick="changePage(${pagination.page - 1})" 
                            class="relative inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50 ${
                                !pagination.has_prev ? 'opacity-50 cursor-not-allowed' : ''
                            }" 
                            ${!pagination.has_prev ? 'disabled' : ''}>
                        前へ
                    </button>
                    <button onclick="changePage(${pagination.page + 1})" 
                            class="ml-3 relative inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50 ${
                                !pagination.has_next ? 'opacity-50 cursor-not-allowed' : ''
                            }" 
                            ${!pagination.has_next ? 'disabled' : ''}>
                        次へ
                    </button>
                </div>
                <div class="hidden sm:flex-1 sm:flex sm:items-center sm:justify-between">
                    <div>
                        <p class="text-sm text-gray-700">
                            <span class="font-medium">${pagination.start_idx}</span>
                            から
                            <span class="font-medium">${pagination.end_idx}</span>
                            件目（全
                            <span class="font-medium">${pagination.total_count}</span>
                            件中）
                        </p>
                    </div>
                    <div>
                        <nav class="relative z-0 inline-flex rounded-md shadow-sm -space-x-px" aria-label="Pagination">
                            <button onclick="changePage(${pagination.page - 1})" 
                                    class="relative inline-flex items-center px-2 py-2 rounded-l-md border border-gray-300 bg-white text-sm font-medium text-gray-500 hover:bg-gray-50 ${
                                        !pagination.has_prev ? 'opacity-50 cursor-not-allowed' : ''
                                    }" 
                                    ${!pagination.has_prev ? 'disabled' : ''}>
                                <i class="fas fa-chevron-left"></i>
                            </button>
                            
                            ${Array.from({length: Math.min(pagination.total_pages, 7)}, (_, i) => {
                                let pageNum;
                                if (pagination.total_pages <= 7) {
                                    pageNum = i + 1;
                                } else if (pagination.page <= 4) {
                                    pageNum = i + 1;
                                } else if (pagination.page >= pagination.total_pages - 3) {
                                    pageNum = pagination.total_pages - 6 + i;
                                } else {
                                    pageNum = pagination.page - 3 + i;
                                }
                                
                                const isCurrentPage = pageNum === pagination.page;
                                const buttonClass = isCurrentPage 
                                    ? 'z-10 bg-primary-50 border-primary-500 text-primary-600' 
                                    : 'bg-white border-gray-300 text-gray-500 hover:bg-gray-50';
                                
                                return `
                                    <button onclick="changePage(${pageNum})" 
                                            class="relative inline-flex items-center px-4 py-2 border text-sm font-medium ${buttonClass}">
                                        ${pageNum}
                                    </button>
                                `;
                            }).join('')}
                            
                            <button onclick="changePage(${pagination.page + 1})" 
                                    class="relative inline-flex items-center px-2 py-2 rounded-r-md border border-gray-300 bg-white text-sm font-medium text-gray-500 hover:bg-gray-50 ${
                                        !pagination.has_next ? 'opacity-50 cursor-not-allowed' : ''
                                    }" 
                                    ${!pagination.has_next ? 'disabled' : ''}>
                                <i class="fas fa-chevron-right"></i>
                            </button>
                        </nav>
                    </div>
                </div>
            </div>
        `;
        
        paginationEl.innerHTML = paginationHTML;
    }
    

    
    // Change page
    function changePage(page) {
        currentPage = page;
        loadStores();
    }
    
    // Refresh data
    function refreshData() {
        currentPage = 1;
        loadStores();
    }
    
    // Filter modal functions
    function openFilterModal() {
        document.getElementById('filter-modal').classList.remove('hidden');
    }
    
    function closeFilterModal() {
        document.getElementById('filter-modal').classList.add('hidden');
    }
    
    function clearFilters() {
        document.getElementById('filter-view-type').value = 'weekly';
        document.getElementById('filter-area').value = '';
        document.getElementById('filter-business-type').value = '';
        document.getElementById('filter-date-from').value = '';
        document.getElementById('filter-date-to').value = '';
    }
    
    function applyFilters() {
        currentFilters.view_type = document.getElementById('filter-view-type').value;
        currentFilters.area = document.getElementById('filter-area').value;
        currentFilters.business_type = document.getElementById('filter-business-type').value;
        currentFilters.date_from = document.getElementById('filter-date-from').value;
        currentFilters.date_to = document.getElementById('filter-date-to').value;
        
        currentPage = 1;
        loadStores();
        closeFilterModal();
    }
    
    // Toggle export dropdown
    function toggleExportDropdown() {
        const dropdown = document.getElementById('export-dropdown');
        dropdown.classList.toggle('hidden');
    }
    
    // Close dropdown when clicking outside
    document.addEventListener('click', function(event) {
        const dropdown = document.getElementById('export-dropdown');
        const button = document.getElementById('export-menu-button');
        
        if (!button.contains(event.target) && !dropdown.contains(event.target)) {
            dropdown.classList.add('hidden');
        }
    });
    
    // Export CSV
    async function exportCSV() {
        // Close dropdown
        document.getElementById('export-dropdown').classList.add('hidden');
        
        try {
            const params = new URLSearchParams(currentFilters);
            
            // Remove empty values
            for (let [key, value] of params.entries()) {
                if (!value) {
                    params.delete(key);
                }
            }
            
            const response = await fetch(`/api/stores/export/csv?${params}`);
            
            if (response.ok) {
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `stores_export_${new Date().toISOString().split('T')[0]}.csv`;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);
                
                showToast('CSVファイルをダウンロードしました', 'success');
            } else {
                throw new Error('Export failed');
            }
        } catch (error) {
            console.error('Error exporting CSV:', error);
            showToast('CSVエクスポートに失敗しました', 'error');
        }
    }
    
    // Export Simple Ranking
    async function exportSimpleRanking() {
        // Close dropdown
        document.getElementById('export-dropdown').classList.add('hidden');
        
        try {
            const params = new URLSearchParams(currentFilters);
            
            // Remove empty values
            for (let [key, value] of params.entries()) {
                if (!value) {
                    params.delete(key);
                }
            }
            
            const response = await fetch(`/api/stores/export/ranking?${params}`);
            
            if (response.ok) {
                const data = await response.text();
                
                // Copy to clipboard
                await navigator.clipboard.writeText(data);
                showToast('簡易ランキングをクリップボードにコピーしました', 'success');
                
                // Also show in a modal or alert for user to see
                alert('簡易ランキング出力:\n\n' + data);
            } else {
                throw new Error('Export failed');
            }
        } catch (error) {
            console.error('Error exporting ranking:', error);
            showToast('簡易ランキング出力に失敗しました', 'error');
        }
    }
    



    // View store detail (placeholder)
    function viewStoreDetail(storeId) {
        showToast(`店舗ID: ${storeId} の詳細表示機能は今後実装予定です`, 'info');
    }
    
    // Open user guide
    function openUserGuide() {
        window.open('/data_guide', '_blank');
    }
    
    // Toggle mobile menu
    function toggleMobileMenu() {
        const menu = document.getElementById('mobile-menu');
        menu.classList.toggle('hidden');
    }
    
    // Close mobile menu when clicking outside
    document.addEventListener('click', function(event) {
        const menu = document.getElementById('mobile-menu');
        const button = document.getElementById('mobile-menu-button');
        
        if (!button.contains(event.target) && !menu.contains(event.target)) {
            menu.classList.add('hidden');
        }
    });
</script>
