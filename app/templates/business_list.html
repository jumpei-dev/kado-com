{% extends "base.html" %}

{% block title %}ビジネス一覧{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <div class="bg-white rounded-lg shadow-lg p-6">
        <h1 class="text-3xl font-bold text-gray-800 mb-6">ビジネス一覧</h1>
        
        <!-- フィルター部分 -->
        <div class="mb-6 p-4 bg-gray-50 rounded-lg">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label for="area-filter" class="block text-sm font-medium text-gray-700 mb-2">エリア</label>
                    <select id="area-filter" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="all">すべて</option>
                        <option value="東京">東京</option>
                        <option value="大阪">大阪</option>
                        <option value="名古屋">名古屋</option>
                        <option value="福岡">福岡</option>
                    </select>
                </div>
                <div>
                    <label for="type-filter" class="block text-sm font-medium text-gray-700 mb-2">業種</label>
                    <select id="type-filter" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="all">すべて</option>
                        <option value="レストラン">レストラン</option>
                        <option value="カフェ">カフェ</option>
                        <option value="居酒屋">居酒屋</option>
                        <option value="ファストフード">ファストフード</option>
                    </select>
                </div>
                <div class="flex items-end">
                    <button id="filter-btn" class="w-full bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition duration-200">
                        フィルター適用
                    </button>
                </div>
            </div>
        </div>
        
        <!-- ローディング表示 -->
        <div id="loading" class="text-center py-8 hidden">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
            <p class="mt-2 text-gray-600">読み込み中...</p>
        </div>
        
        <!-- エラー表示 -->
        <div id="error-message" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4 hidden">
            <p id="error-text"></p>
        </div>
        
        <!-- ビジネス一覧テーブル -->
        <div id="business-table-container" class="overflow-x-auto">
            <table class="min-w-full bg-white border border-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ID</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">店舗名</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">エリア</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">都道府県</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">業種</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">収容人数</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">営業時間</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">更新日時</th>
                    </tr>
                </thead>
                <tbody id="business-tbody" class="bg-white divide-y divide-gray-200">
                    <!-- データはJavaScriptで動的に挿入 -->
                </tbody>
            </table>
        </div>
        
        <!-- ページネーション -->
        <div id="pagination" class="mt-6 flex justify-between items-center">
            <div id="pagination-info" class="text-sm text-gray-700">
                <!-- ページ情報 -->
            </div>
            <div class="flex space-x-2">
                <button id="prev-btn" class="px-4 py-2 bg-gray-300 text-gray-700 rounded-md hover:bg-gray-400 transition duration-200 disabled:opacity-50 disabled:cursor-not-allowed">
                    前へ
                </button>
                <button id="next-btn" class="px-4 py-2 bg-gray-300 text-gray-700 rounded-md hover:bg-gray-400 transition duration-200 disabled:opacity-50 disabled:cursor-not-allowed">
                    次へ
                </button>
            </div>
        </div>
    </div>
</div>

<script>
class BusinessList {
    constructor() {
        this.currentPage = 0;
        this.limit = 20;
        this.totalCount = 0;
        this.init();
    }
    
    init() {
        this.bindEvents();
        this.loadBusinesses();
    }
    
    bindEvents() {
        document.getElementById('filter-btn').addEventListener('click', () => {
            this.currentPage = 0;
            this.loadBusinesses();
        });
        
        document.getElementById('prev-btn').addEventListener('click', () => {
            if (this.currentPage > 0) {
                this.currentPage--;
                this.loadBusinesses();
            }
        });
        
        document.getElementById('next-btn').addEventListener('click', () => {
            if ((this.currentPage + 1) * this.limit < this.totalCount) {
                this.currentPage++;
                this.loadBusinesses();
            }
        });
    }
    
    async loadBusinesses() {
        const loading = document.getElementById('loading');
        const errorMessage = document.getElementById('error-message');
        const tableContainer = document.getElementById('business-table-container');
        
        loading.classList.remove('hidden');
        errorMessage.classList.add('hidden');
        tableContainer.style.opacity = '0.5';
        
        try {
            const area = document.getElementById('area-filter').value;
            const type = document.getElementById('type-filter').value;
            const offset = this.currentPage * this.limit;
            
            const params = new URLSearchParams({
                limit: this.limit,
                offset: offset,
                area: area,
                type: type
            });
            
            const response = await fetch(`/api/stores/businesses?${params}`);
            const data = await response.json();
            
            if (data.success) {
                this.renderBusinesses(data.data);
                this.updatePagination(data.pagination);
                this.totalCount = data.pagination.total;
            } else {
                throw new Error(data.error || 'データの取得に失敗しました');
            }
        } catch (error) {
            console.error('Error loading businesses:', error);
            document.getElementById('error-text').textContent = error.message;
            errorMessage.classList.remove('hidden');
        } finally {
            loading.classList.add('hidden');
            tableContainer.style.opacity = '1';
        }
    }
    
    renderBusinesses(businesses) {
        const tbody = document.getElementById('business-tbody');
        tbody.innerHTML = '';
        
        businesses.forEach(business => {
            const row = document.createElement('tr');
            row.className = 'hover:bg-gray-50';
            
            const openTime = business.open_hour ? business.open_hour.substring(0, 5) : '-';
            const closeTime = business.close_hour ? business.close_hour.substring(0, 5) : '-';
            const operatingHours = (openTime !== '-' && closeTime !== '-') ? `${openTime} - ${closeTime}` : '-';
            
            const updatedAt = business.updated_at ? new Date(business.updated_at).toLocaleDateString('ja-JP') : '-';
            
            row.innerHTML = `
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${business.business_id}</td>
                <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">
                    <div class="max-w-xs truncate" title="${business.name}">${business.name}</div>
                </td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${business.area || '-'}</td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${business.prefecture || '-'}</td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${business.type || '-'}</td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${business.capacity || '-'}</td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${operatingHours}</td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${updatedAt}</td>
            `;
            
            tbody.appendChild(row);
        });
    }
    
    updatePagination(pagination) {
        const info = document.getElementById('pagination-info');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        
        const start = pagination.offset + 1;
        const end = Math.min(pagination.offset + pagination.limit, pagination.total);
        
        info.textContent = `${start}-${end} / ${pagination.total}件`;
        
        prevBtn.disabled = pagination.offset === 0;
        nextBtn.disabled = !pagination.has_more;
    }
}

// ページ読み込み時に初期化
document.addEventListener('DOMContentLoaded', () => {
    new BusinessList();
});
</script>
{% endblock %}
